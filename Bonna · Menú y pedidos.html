<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonna · Menú y pedidos</title>
<style>
  :root { --bg:#faf7f4; --card:#fff; --ink:#292524; --muted:#78716c; --line:#e7e0da; --brand:#92400e; --brand-d:#78350f; --soft:#fef3c7; --green:#15803d; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#1c1917; --card:#292524; --ink:#f5f5f4; --muted:#a8a29e; --line:#44403c; --brand:#d97706; --brand-d:#b45309; --soft:#3b2f12; --green:#4ade80; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.4; }
  header { background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  .wrap { max-width:1000px; margin:0 auto; padding:0 16px; }
  .head { display:flex; justify-content:space-between; align-items:center; padding:14px 0; }
  .head h1 { margin:0; font-size:22px; }
  .head p { margin:2px 0 0; font-size:12px; color:var(--muted); }
  .head a { font-size:13px; font-weight:600; color:var(--brand); text-decoration:none; }
  main { max-width:1000px; margin:0 auto; padding:20px 16px 40px; display:grid; grid-template-columns:1fr; gap:24px; }
  @media (min-width:900px) { main { grid-template-columns:2fr 1fr; } .cartbox { position:sticky; top:84px; align-self:start; } }
  .promo { background:var(--soft); border:1px solid var(--brand); border-radius:14px; padding:12px 14px; font-size:13px; margin-bottom:16px; }
  .promo b { font-size:14px; }
  .cats { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px; }
  .cats button { white-space:nowrap; border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:12px; padding:8px 14px; font-size:12px; font-weight:600; cursor:pointer; }
  .cats button.on { background:var(--brand); border-color:var(--brand); color:#fff; }
  .grid { display:grid; grid-template-columns:1fr; gap:12px; }
  @media (min-width:560px) { .grid { grid-template-columns:1fr 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; display:flex; flex-direction:column; justify-content:space-between; }
  .card .top { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; margin-bottom:6px; }
  .card h3 { margin:0; font-size:16px; }
  .price { background:var(--soft); color:var(--brand); font-weight:700; font-size:13px; padding:4px 10px; border-radius:10px; white-space:nowrap; }
  .desc { font-size:12px; color:var(--muted); margin:0 0 10px; }
  .tlabel { font-size:11px; font-weight:600; margin:0 0 6px; }
  .tops { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .tops button { border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:10px; padding:5px 8px; font-size:11px; cursor:pointer; }
  .tops button.on { background:var(--brand); border-color:var(--brand); color:#fff; }
  .foot { display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--line); padding-top:10px; }
  .foot span { font-size:12px; color:var(--muted); }
  .add { background:var(--ink); color:var(--bg); border:0; border-radius:12px; padding:8px 14px; font-size:12px; font-weight:600; cursor:pointer; }
  .cartbox { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; }
  .cartbox h2 { margin:0; font-size:18px; }
  .row { display:flex; justify-content:space-between; align-items:center; }
  .badge { background:var(--soft); color:var(--brand); font-size:12px; font-weight:600; padding:3px 10px; border-radius:99px; }
  #cart-items { max-height:260px; overflow-y:auto; margin:12px 0; }
  .empty { text-align:center; color:var(--muted); font-size:14px; padding:24px 0; }
  .item { display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); font-size:12px; }
  .item .info { flex:1; } .item .info b { display:block; font-size:13px; } .item .info small { color:var(--muted); display:block; }
  .qty { display:flex; align-items:center; gap:6px; background:var(--bg); border-radius:10px; padding:3px; }
  .qty button { width:26px; height:26px; border:0; border-radius:8px; font-weight:700; cursor:pointer; background:var(--card); color:var(--ink); }
  .qty button.p { background:var(--brand); color:#fff; }
  .sub { width:70px; text-align:right; font-weight:700; }
  .sum { border-top:1px solid var(--line); padding-top:10px; font-size:14px; }
  .sum .row { margin-bottom:6px; color:var(--muted); }
  .sum .disc { color:var(--green); }
  .sum .tot { color:var(--ink); font-weight:700; font-size:17px; border-top:1px dashed var(--line); padding-top:8px; }
  .sum .tot span:last-child { color:var(--brand); }
  label { display:block; font-size:12px; font-weight:600; margin:12px 0 4px; }
  input, select, textarea { width:100%; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:10px; padding:10px; font-size:16px; font-family:inherit; }
  textarea { resize:none; }
  .send { width:100%; margin-top:16px; background:var(--brand); color:#fff; border:0; border-radius:14px; padding:14px; font-size:15px; font-weight:600; cursor:pointer; }
  .send:hover { background:var(--brand-d); }
  .hidden { display:none !important; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translate(-50%,80px); opacity:0; background:#1c1917; color:#fff; padding:10px 16px; border-radius:12px; font-size:13px; transition:all .3s; z-index:50; }
  #toast.show { transform:translate(-50%,0); opacity:1; }
</style>
</head>
<body>
<header><div class="wrap head">
  <div><h1>🍪 Bonna</h1><p>Armá tu pedido y mandalo por WhatsApp</p></div>
  <a href="https://instagram.com/bonnaa.co" target="_blank" rel="noopener">@bonnaa.co</a>
</div></header>

<main>
  <section>
    <div class="promo" id="promo-banner">
      <b>🌷 Promo Día de la Madre</b><br>
      10% off desde 6 cookies · 15% off desde 2 cuchareables.<br>
      Entregas: sábado a la tarde y domingo a la mañana.
    </div>
    <div class="cats" id="category-list"></div>
    <div class="grid" id="products-grid"></div>
  </section>

  <section>
    <div class="cartbox">
      <div class="row"><h2>🛍️ Tu pedido</h2><span class="badge" id="cart-count">0 ítems</span></div>
      <div id="cart-items"></div>
      <div class="sum hidden" id="cart-summary">
        <div class="row"><span>Subtotal</span><span id="subtotal-price"></span></div>
        <div class="row disc hidden" id="discount-row"><span id="discount-label"></span><span id="discount-price"></span></div>
        <div class="row tot"><span>Total</span><span id="total-price"></span></div>
      </div>

      <label for="user-name">Tu nombre *</label>
      <input type="text" id="user-name" placeholder="Ej. Ana">
      <label for="delivery">Entrega</label>
      <select id="delivery"><option>Sábado a la tarde</option><option>Domingo a la mañana</option><option>A coordinar</option></select>
      <label for="custom-note">Notas / pedido personalizado</label>
      <textarea id="custom-note" rows="3" placeholder="Ej. Es un regalo, quiero una dedicatoria..."></textarea>
      <button class="send" id="send-btn">💬 Enviar por WhatsApp</button>
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
const WHATSAPP = '5493755579942';
const PROMO_ACTIVE = true; // false después del Día de la Madre (18/10/2026)

const products = [
  { id:1,  name:'Cookie Kinder',           category:'Cookies', price:4000, desc:'Cookie con chocolate Kinder y decoración.' },
  { id:2,  name:'Cookie Choco chips',      category:'Cookies', price:3500, desc:'La clásica, con chips y trozos de chocolate.' },
  { id:3,  name:'Cookie Nutella',          category:'Cookies', price:3500, desc:'Con Nutella.' },
  { id:4,  name:'Cookie Pistacho',         category:'Cookies', price:3500, desc:'Con pistachos.' },
  { id:5,  name:'Cookie Red Velvet',       category:'Cookies', price:3500, desc:'Red velvet con chocolate blanco.' },
  { id:6,  name:'Cookie Nueces',           category:'Cookies', price:3000, desc:'Con nueces.' },
  { id:7,  name:'Cookie Chocolate blanco', category:'Cookies', price:3500, desc:'Con chips y trozos de chocolate blanco.' },
  { id:8,  name:'Cookie Limón',            category:'Cookies', price:3000, desc:'Suave y cítrica, con azúcar impalpable.' },
  { id:9,  name:'Cuchareable de brownie',  category:'Cuchareables', price:12000, desc:'Brownie húmedo con Nutella para comer con cuchara.', toppings:true },
  { id:10, name:'Cuchareable de cookie',   category:'Cuchareables', price:13000, desc:'Cookie con chips y chocolate para comer con cuchara.', toppings:true },
  { id:11, name:'Brownie tradicional',     category:'Brownies', price:6500, desc:'Porción grande, en caja individual.' },
  { id:12, name:'Sandwichito de miga',     category:'Para acompañar', price:3000, desc:'Sandwichito de miga.' },
  { id:13, name:'Galletitas de maicena',   category:'Para acompañar', price:3000, desc:'Galletitas de maicena.' },
  { id:14, name:'Jugo de naranja',         category:'Bebidas', price:3000, desc:'Jugo de naranja.' },
  { id:15, name:'Chocolatada',             category:'Bebidas', price:3500, desc:'Chocolatada.' }
];
const toppings = [
  { name:'Oreo', price:1000 }, { name:'Kinder', price:1000 }, { name:'Chocolate', price:700 },
  { name:'Ferrero', price:1000 }, { name:'Malvaviscos', price:500 }
];

let cart = [], selectedCategory = 'Todos';
const pendingTops = {};
const $ = id => document.getElementById(id);
const fmt = n => '$' + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

function renderCategories() {
  const cats = ['Todos'].concat(products.map(p => p.category).filter((c,i,a) => a.indexOf(c) === i));
  $('category-list').innerHTML = cats.map(c =>
    `<button class="${selectedCategory===c?'on':''}" data-cat="${c}">${c}</button>`).join('');
}
function renderProducts() {
  const items = products.filter(p => selectedCategory === 'Todos' || p.category === selectedCategory);
  $('products-grid').innerHTML = items.map(p => {
    const tops = pendingTops[p.id] || [];
    const extra = tops.reduce((s,t) => s + toppings.find(x => x.name===t).price, 0);
    return `<div class="card"><div>
      <div class="top"><h3>${p.name}</h3><span class="price">${fmt(p.price)}</span></div>
      <p class="desc">${p.desc}</p>
      ${p.toppings ? `<p class="tlabel">Toppings (opcional)</p><div class="tops">${toppings.map(t =>
        `<button class="${tops.includes(t.name)?'on':''}" data-top="${t.name}" data-id="${p.id}">${t.name} +${fmt(t.price)}</button>`).join('')}</div>` : ''}
      </div>
      <div class="foot"><span>${p.category}</span>
        <button class="add" data-add="${p.id}">+ Agregar${extra ? ' · ' + fmt(p.price+extra) : ''}</button></div></div>`;
  }).join('');
}
function addToCart(id) {
  const p = products.find(x => x.id === id);
  const tops = (pendingTops[id] || []).slice().sort();
  const extra = tops.reduce((s,t) => s + toppings.find(x => x.name===t).price, 0);
  const key = id + '|' + tops.join(',');
  const ex = cart.find(i => i.key === key);
  if (ex) ex.qty++; else cart.push({ key, id, name:p.name, category:p.category, unitPrice:p.price+extra, qty:1, tops });
  pendingTops[id] = [];
  renderProducts(); renderCart(); toast('Agregado: ' + p.name);
}
function updateQty(key, d) {
  const it = cart.find(i => i.key === key); if (!it) return;
  it.qty += d; if (it.qty <= 0) cart = cart.filter(i => i.key !== key);
  renderCart();
}
function calcTotals() {
  const subtotal = cart.reduce((s,i) => s + i.unitPrice*i.qty, 0);
  let discount = 0; const labels = [];
  if (PROMO_ACTIVE) {
    const ck = cart.filter(i => i.category==='Cookies'), cu = cart.filter(i => i.category==='Cuchareables');
    const nck = ck.reduce((s,i) => s+i.qty, 0), ncu = cu.reduce((s,i) => s+i.qty, 0);
    if (nck >= 6) { discount += Math.round(ck.reduce((s,i) => s+i.unitPrice*i.qty, 0)*0.10); labels.push('10% cookies'); }
    if (ncu >= 2) { discount += Math.round(cu.reduce((s,i) => s+i.unitPrice*i.qty, 0)*0.15); labels.push('15% cuchareables'); }
  }
  return { subtotal, discount, total: subtotal-discount, label: labels.join(' + ') };
}
function renderCart() {
  const n = cart.reduce((a,i) => a+i.qty, 0);
  $('cart-count').textContent = n + ' ítem' + (n!==1?'s':'');
  if (!cart.length) {
    $('cart-items').innerHTML = '<p class="empty">Tu pedido está vacío.<br>¡Elegí lo que más te guste!</p>';
    $('cart-summary').classList.add('hidden'); return;
  }
  $('cart-summary').classList.remove('hidden');
  $('cart-items').innerHTML = cart.map(i => `<div class="item">
    <div class="info"><b>${i.name}</b>${i.tops.length?`<small>+ ${i.tops.join(', ')}</small>`:''}<small>${fmt(i.unitPrice)} c/u</small></div>
    <div class="qty"><button data-q="-1" data-key="${i.key}">-</button><b>${i.qty}</b><button class="p" data-q="1" data-key="${i.key}">+</button></div>
    <span class="sub">${fmt(i.unitPrice*i.qty)}</span></div>`).join('');
  const t = calcTotals();
  $('subtotal-price').textContent = fmt(t.subtotal);
  $('total-price').textContent = fmt(t.total);
  if (t.discount > 0) {
    $('discount-row').classList.remove('hidden');
    $('discount-label').textContent = 'Promo (' + t.label + ')';
    $('discount-price').textContent = '-' + fmt(t.discount);
  } else $('discount-row').classList.add('hidden');
}
function sendOrder() {
  if (!cart.length) return toast('Agregá productos antes de enviar.');
  const name = $('user-name').value.trim();
  if (!name) { toast('Ingresá tu nombre.'); $('user-name').focus(); return; }
  const note = $('custom-note').value.trim(), delivery = $('delivery').value, t = calcTotals();
  let msg = '¡Hola Bonna! Quisiera hacer el siguiente pedido:\n\n👤 *Nombre:* ' + name + '\n-----------------------------------\n';
  cart.forEach(i => { msg += '• ' + i.qty + 'x ' + i.name + (i.tops.length ? ' (+ ' + i.tops.join(', ') + ')' : '') + ' — ' + fmt(i.unitPrice*i.qty) + '\n'; });
  msg += '-----------------------------------\n';
  if (t.discount > 0) msg += 'Subtotal: ' + fmt(t.subtotal) + '\n🌷 Promo ' + t.label + ': -' + fmt(t.discount) + '\n';
  msg += '💰 *Total:* ' + fmt(t.total) + '\n\n🚚 *Entrega:* ' + delivery + '\n';
  if (note) msg += '\n📝 *Notas:* "' + note + '"\n';
  msg += '\n¡Gracias!';
  const url = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg);
  const w = window.open(url, '_blank');
  if (!w) window.location.href = url;
}
let tt;
function toast(text) {
  const el = $('toast'); el.textContent = text; el.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2200);
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.cat) { selectedCategory = b.dataset.cat; renderCategories(); renderProducts(); }
  else if (b.dataset.add) addToCart(+b.dataset.add);
  else if (b.dataset.top) {
    const id = +b.dataset.id, l = pendingTops[id] || (pendingTops[id] = []), i = l.indexOf(b.dataset.top);
    i >= 0 ? l.splice(i,1) : l.push(b.dataset.top); renderProducts();
  }
  else if (b.dataset.q) updateQty(b.dataset.key, +b.dataset.q);
  else if (b.id === 'send-btn') sendOrder();
});

if (!PROMO_ACTIVE) $('promo-banner').classList.add('hidden');
renderCategories(); renderProducts(); renderCart();
</script>
</body>
</html>

</body></html>
